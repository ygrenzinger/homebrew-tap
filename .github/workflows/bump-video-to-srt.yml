name: Bump video-to-srt formula

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag, e.g. v1.1.0"
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest

    env:
      UPSTREAM_REPO: ygrenzinger/video-to-srt
      FORMULA: Formula/video-to-srt.rb

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Fetch latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_TAG}" ]; then
            gh api "repos/${UPSTREAM_REPO}/releases/tags/${INPUT_TAG}" > release.json
          else
            gh api "repos/${UPSTREAM_REPO}/releases/latest" > release.json
          fi

          tag="$(jq -r '.tag_name' release.json)"
          version="${tag#v}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          jq -r '.assets[] | [.name, .browser_download_url, .digest] | @tsv' release.json > assets.tsv

      - name: Update formula
        id: update
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          current="$(ruby -ne 'puts $1 if /version "([^"]+)"/' "$FORMULA")"
          if [ "$current" = "$VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ruby <<'RUBY'
          formula = ENV.fetch("FORMULA")
          version = ENV.fetch("VERSION")

          assets = {}
          File.readlines("assets.tsv", chomp: true).each do |line|
            name, url, digest = line.split("\t")
            next unless name&.end_with?(".tar.gz")

            assets[name] = {
              url: url,
              sha256: digest.sub(/\Asha256:/, ""),
            }
          end

          platforms = %w[
            darwin_arm64
            darwin_amd64
            linux_arm64
            linux_amd64
          ]

          text = File.read(formula)
          text.sub!(/version "[^"]+"/, %(version "#{version}"))

          platforms.each do |platform|
            filename = "video-to-srt_#{version}_#{platform}.tar.gz"
            asset = assets.fetch(filename) { abort "Missing release asset: #{filename}" }

            pattern = %r{url "https://github\.com/ygrenzinger/video-to-srt/releases/download/v[^/]+/video-to-srt_[^"]+_#{platform}\.tar\.gz"\n\s+sha256 "[0-9a-f]{64}"}
            replacement = %(url "#{asset[:url]}"\n      sha256 "#{asset[:sha256]}")

            abort "Could not update #{platform}" unless text.sub!(pattern, replacement)
          end

          File.write(formula, text)
          RUBY

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate formula syntax
        if: steps.update.outputs.changed == 'true'
        run: ruby -c "$FORMULA"

      - name: Validate formula with Homebrew
        if: steps.update.outputs.changed == 'true'
        env:
          HOMEBREW_NO_INSTALL_FROM_API: "1"
          HOMEBREW_NO_SANDBOX_LINUX: "1"
        run: |
          set -euo pipefail

          tap_dir="$(brew --repository)/Library/Taps/ygrenzinger/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          rm -rf "$tap_dir"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

          brew style "$FORMULA"
          brew audit --strict --online --display-filename --formula ygrenzinger/tap/video-to-srt
          brew install --formula ygrenzinger/tap/video-to-srt
          brew test ygrenzinger/tap/video-to-srt

      - name: Commit to main
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FORMULA"
          git commit -m "Update video-to-srt to ${VERSION}"
          git push origin HEAD:main
